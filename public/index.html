<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OrbitCell Studio · AI Agent Development Workspace</title>
<meta name="description" content="OrbitCell Studio — Unify Agents, Models, Tools and Workflows. 统一 AI 智能体开发工作空间。">
<link rel="stylesheet" href="/vendor/hljs/styles/github.css" id="hljsCss">
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/workspace.css">
<link rel="stylesheet" href="/workbench.css">
<link rel="stylesheet" href="/features.css">
<link rel="stylesheet" href="/polish.css">
<link rel="stylesheet" href="/model-center.css">
<link rel="stylesheet" href="/issue-fixes.css">
<link rel="stylesheet" href="/vendor/xterm.css">
<link rel="stylesheet" href="/interface.css">
<link rel="stylesheet" href="/agent-center.css">
<link rel="stylesheet" href="/management.css">
<link rel="stylesheet" href="/design-system.css">
<link rel="stylesheet" href="/workspace-layout.css">
<link rel="stylesheet" href="/conversation.css">
<link rel="stylesheet" href="/management-refactor.css">
<link rel="stylesheet" href="/agent-workflows.css">
<link rel="stylesheet" href="/orbitcell.css">
<link rel="icon" href="/brand.svg" type="image/svg+xml">
</head>
<body>
<div id="app">
  <!-- ================= 侧栏 ================= -->
  <aside id="sidebar">
    <div class="brand">
      <div class="brand-logo" aria-hidden="true"><img src="/brand.svg" alt="" width="32" height="32"></div>
      <div class="brand-text">
        <div class="brand-name">OrbitCell</div>
        <div class="brand-sub">统一 AI 智能体开发工作空间</div>
      </div>
    </div>

    <button type="button" class="side-newtask" id="btnNewTask" title="选择 Agent，在当前项目下新建任务">
      <span class="nt-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span>
      <span>新建任务</span>
      <span class="nt-key">Alt+N</span>
    </button>
    <nav class="side-navigation" aria-label="工作导航">
      <button type="button" class="side-workbench" id="btnWorkbench" title="所有 Agent 的运行状态、任务与改动">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
        <span class="side-nav-label">工作台</span>
      </button>
      <button type="button" class="side-workbench side-inbox" id="btnInbox" title="任务收件箱：等待你处理 / 运行中 / 失败 / 已完成的会话">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16l2 10v6H2v-6L4 4Z"/><path d="M2 14h6l2 3h4l2-3h6"/></svg>
        <span class="side-nav-label">收件箱</span><span id="inboxHint" aria-live="polite"></span>
      </button>
      <button type="button" class="side-workbench" id="btnProjectCenter" title="管理项目、运行环境与各 Agent 的会话" aria-label="项目管理">
        <span data-ui-icon="folder" aria-hidden="true"></span><span class="side-nav-label">项目</span>
      </button>
      <button type="button" class="side-workbench" id="btnAgentCenter" disabled aria-busy="true" title="管理 Agent、运行环境、模型默认值与诊断">
        <span data-ui-icon="agents" aria-hidden="true"></span><span class="side-nav-label">Agent</span>
      </button>
      <button type="button" class="side-workbench side-models" id="btnModelCenter" disabled aria-busy="true" title="模型目录、共享连接与配置档案">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="m12 3 8 4.5v9L12 21l-8-4.5v-9L12 3Z"/><path d="m4 7.5 8 5 8-5M12 12.5V21"/></svg><span class="side-nav-label">模型</span><small id="footModelCount"></small>
      </button>
      <button type="button" class="side-workbench" id="btnCapabilities" disabled aria-busy="true" title="管理技能、MCP 服务器与助手">
        <svg class="ui-icon" data-icon="capabilities" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="3.5" width="6.5" height="6.5" rx="1.8"/><rect x="3.5" y="14" width="6.5" height="6.5" rx="1.8"/><rect x="14" y="14" width="6.5" height="6.5" rx="1.8"/><path d="m17.25 2.75 4 4-4 4-4-4 4-4Z"/></svg>
        <span class="side-nav-label">能力</span>
      </button>
      <button type="button" class="side-workbench" id="btnEnvironments" disabled aria-busy="true" title="按本机、WSL 与 SSH 运行环境查看 Agent">
        <span data-ui-icon="monitor" aria-hidden="true"></span><span class="side-nav-label">运行环境</span>
      </button>
    </nav>
    

    <details class="side-agent-filter" id="agentFilterDetails">
      <summary><span>当前 Agent</span><span id="agentFilterLabel">选择 Agent</span></summary>
      <div class="agent-grid" id="agentGrid"></div>
    </details>

    <div class="side-search">
      <div class="search-wrap">
        <span class="search-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></span>
        <input id="searchBox" placeholder="搜索会话 / 消息…" aria-label="搜索会话 / 消息" autocomplete="off">
        <span class="search-key">Ctrl+K</span>
      </div>
    </div>

    <div class="side-section">
      <div class="side-head">
        <button type="button" class="side-project-link" id="btnSidebarProjects" title="项目管理" aria-label="项目管理"><span data-ui-icon="folder" aria-hidden="true"></span><span>项目</span><span data-ui-icon="chevronRight" aria-hidden="true"></span></button>
        <button type="button" class="btn-mini side-archive" id="btnArchiveSessions" title="归档会话" aria-label="归档会话"><span data-ui-icon="archive" aria-hidden="true"></span></button>
        <button type="button" class="btn-mini" id="btnNewChat" title="新建会话" aria-label="新建会话"><span data-ui-icon="plus" aria-hidden="true"></span><span class="side-new-label">新会话</span></button>
      </div>
      <div class="session-list" id="sessionList"></div>
      <!-- 多选批量操作条：进入多选后出现，Esc 或「取消」退出 -->
      <div id="multiBar" class="multi-bar hidden" role="toolbar" aria-label="批量操作">
        <span class="mb-count">已选 0 个</span>
        <button type="button" class="btn-mini" data-mb="archive" title="移出活跃列表，可在归档里恢复">归档</button>
        <button type="button" class="btn-mini" data-mb="settle" title="收起（可随时恢复）">收起</button>
        <button type="button" class="btn-mini" data-mb="pin" title="批量置顶">置顶</button>
        <button type="button" class="btn-mini" data-mb="read" title="标记为已读">已读</button>
        <button type="button" class="btn-mini" data-mb="delete" title="删除（不可恢复）">删除</button>
        <button type="button" class="btn-mini" data-mb="cancel">取消</button>
      </div>
    </div>

    <div class="side-footer">
      <button type="button" class="foot-btn" id="btnBrowserDock" title="在右侧打开任务浏览器" aria-pressed="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M14 9v11M6 6.5h.1M9 6.5h.1"/></svg><span>浏览器</span>
      </button>
      <button class="foot-btn" id="btnFeatures" title="工具箱：运行配置、开发与协作流程">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="4" y="7" width="16" height="13" rx="2"/><path d="M8 7V4h8v3M4 12h16M10 12v3h4v-3"/></svg><span>工具箱</span>
      </button>
      <div class="foot-utilities" role="group" aria-label="工作区工具">
      <button class="foot-btn" id="btnLocalTerm" title="当前环境终端" aria-label="当前环境终端">
        <svg viewBox="0 0 24 24"><path d="M4 17l6-5-6-5M12 19h8" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>终端</span>
      </button>
      <button class="foot-btn" id="btnStats" title="用量统计" aria-label="用量统计">
        <svg viewBox="0 0 24 24"><path d="M4 20V10m6 10V4m6 16v-7m4 7H2" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
        <span>用量</span>
      </button>
      <button class="foot-btn" id="btnProviders" title="API 连接管理" aria-label="API 连接管理">
        <svg viewBox="0 0 24 24"><path d="M12 3l8 4v5c0 5-3.5 8-8 9-4.5-1-8-4-8-9V7l8-4z" stroke="currentColor" stroke-width="2" fill="none" stroke-linejoin="round"/></svg>
        <span>API 管理</span>
      </button>
      <button class="foot-btn" id="btnSSH" title="SSH 主机管理" aria-label="SSH 主机管理">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="14" rx="2" stroke="currentColor" stroke-width="2" fill="none"/><path d="M8 21h8M12 18v3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <span>SSH</span>
      </button>
      <button class="foot-btn" id="btnScheduled" title="定时任务" aria-label="定时任务">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3.5 2"/></svg>
        <span>定时</span>
      </button>
      <button class="foot-btn" id="btnSettings" title="设置" aria-label="设置">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2" fill="none"/><path d="M12 2v3m0 14v3M2 12h3m14 0h3M4.9 4.9l2.1 2.1m10 10l2.1 2.1m0-14.2l-2.1 2.1m-10 10l-2.1 2.1" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <span>设置</span>
      </button>
      </div>
    </div>
  </aside>

  <!-- ================= 主区 ================= -->
  <main id="main">
    <section id="agentCenterPage" class="agent-center-page" aria-label="Agent 管理" hidden></section>
    <header id="mainHeader">
      <div class="hdr-left">
        <button id="sbToggle" class="sb-toggle" title="侧栏" aria-label="打开或隐藏侧栏" aria-expanded="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <div class="hdr-heading">
        <div class="hdr-title-row"><div class="hdr-title" id="hdrTitle" title="双击重命名">新会话</div><button type="button" id="btnSessionMore" class="btn-mini ctrl-menu session-title-more" aria-label="当前会话操作" aria-haspopup="menu" aria-expanded="false" title="会话操作" hidden><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg></button></div>
        <div class="hdr-context">
          <button type="button" class="badge ws-chip" id="assistantChip" title="会话助手：系统提示词与默认运行参数" aria-haspopup="menu">✦ 助手</button>
          <div class="hdr-badges" id="hdrBadges"></div>
        </div>
        </div>
      </div>
      <div class="hdr-right" role="group" aria-label="会话工具">
        <button type="button" class="btn-mini ctrl-menu" id="btnHeaderMore" aria-label="更多会话操作" aria-haspopup="menu" aria-expanded="false" title="更多会话操作"><svg class="header-action-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="19" cy="12" r="1.7"/></svg></button>
        <span class="hdr-usage" id="hdrUsage" title="本机累计 token（不含 cc-switch 代理记录）"></span>
        <button class="btn-mini header-action" id="btnExport" title="导出当前会话为 Markdown">
          <svg class="header-action-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v11m0 0 4-4m-4 4-4-4M5 20h14"/></svg>
          <span>导出</span>
        </button>
        <button class="btn-mini header-action" id="btnFiles" title="工作区文件：浏览 / 新建 / 重命名 / 编辑（Ctrl+E）" style="display:none"><svg class="header-action-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6.5A1.5 1.5 0 0 1 4.5 5h4l1.6 2H19.5A1.5 1.5 0 0 1 21 8.5v9A1.5 1.5 0 0 1 19.5 19h-15A1.5 1.5 0 0 1 3 17.5v-11Z"/></svg><span>文件</span></button>
        <button class="btn-mini header-action" id="btnRunning" title="查看运行中的 Agent 命令" aria-label="运行中的命令"><svg class="header-action-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="14" rx="2"/><path d="m7.5 10 2.5 2-2.5 2M12.5 15h4"/></svg><span id="runningCount">运行</span></button>
        <button class="btn-mini header-action" id="btnSystemMonitor" title="查看本机或 SSH 主机的 CPU、内存、显存和网速" aria-label="电脑资源"><svg class="header-action-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="5" width="14" height="14" rx="3"/><path d="M9 2v3m6-3v3M9 19v3m6-3v3M2 9h3m-3 6h3m14-6h3m-3 6h3M9 14l2-4 2 4 2-4"/></svg><span>资源</span></button>
        <button class="btn-mini header-action" id="btnSubagents" title="子代理面板：当前会话的委派清单（Task/Agent 工具调用）" aria-label="子代理面板"><svg class="header-action-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="7" cy="7" r="2.6"/><circle cx="17" cy="7" r="2.6"/><circle cx="12" cy="18" r="2.6"/><path d="M8.6 9 10.8 15.6M15.4 9l-2.2 6.6M9.6 7h4.8"/></svg><span>子代理</span></button>
        <button class="btn-mini header-action" id="btnGit" title="项目变更中心：改动 / 会话记录 / 快照 / 提交" style="display:none"><svg class="header-action-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="6" cy="6" r="2.4"/><circle cx="6" cy="18" r="2.4"/><circle cx="18" cy="6" r="2.4"/><path d="M6 8.4v7.2M18 8.4a9 9 0 0 1-9 9.2"/></svg><span>变更</span></button>
        <button class="btn-mini header-action" id="btnCompare" title="从同一 Git 快照并行运行两个 Agent" style="display:none"><svg class="header-action-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 4 4 8l4 4"/><path d="M4 8h13a3 3 0 0 1 3 3v1"/><path d="M16 20l4-4-4-4"/><path d="M20 16H7a3 3 0 0 1-3-3v-1"/></svg><span>对比</span></button>
        <button class="btn-mini header-action" id="btnSessUsage" title="本会话 token 明细">
          <svg class="header-action-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19h16M6 16v-4M10 16V8M14 16V5M18 16v-7"/></svg>
          <span id="sessUsageLabel">会话用量</span>
        </button>
        <button type="button" class="btn-mini header-appearance" id="btnTheme" title="外观与配色" aria-label="外观与配色" aria-haspopup="dialog">
          <svg class="ui-icon" data-icon="appearance" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5a8.5 8.5 0 0 1 0 17Z" fill="currentColor" stroke="none"/></svg><span class="appearance-label">外观</span>
        </button>
      </div>
    </header>

    <!-- T3 Code 式工作区标签：多个会话可以同时打开，切换时不丢上下文。 -->
    <nav id="sessionTabs" class="session-tabs" aria-label="已打开会话标签"></nav>

    <div id="contentWrap">
      <div id="messages"></div>
      <button id="scrollBtn" class="hidden" title="回到底部">↓</button>

      <!-- 会话内搜索：Ctrl+F 打开，Enter / Shift+Enter 上下跳，Esc 关闭 -->
      <div id="msgSearch" class="hidden" role="search" aria-label="会话内搜索">
        <span class="ms-ico" aria-hidden="true">⌕</span>
        <input id="msgSearchInput" placeholder="在本会话中查找…" autocomplete="off" spellcheck="false" aria-label="查找内容">
        <span id="msgSearchCount" class="ms-count" aria-live="polite">0/0</span>
        <button type="button" class="ms-btn" id="msgSearchPrev" title="上一个（Shift+Enter）" aria-label="上一个匹配">↑</button>
        <button type="button" class="ms-btn" id="msgSearchNext" title="下一个（Enter）" aria-label="下一个匹配">↓</button>
        <button type="button" class="ms-btn" id="msgSearchClose" title="关闭（Esc）" aria-label="关闭搜索">✕</button>
      </div>

      <!-- 回合导航导轨：每个用户回合一个刻度，点击直达；位置随滚动高亮 -->
      <div id="msgRail" class="hidden" role="navigation" aria-label="回合导航"></div>

      <div id="composer">
      <div class="composer-inner">
        <div id="queueTray" class="queue-tray hidden" aria-live="polite"></div>
        <button type="button" id="sessionPlan" class="session-plan" aria-label="查看执行计划" hidden></button>
        <div class="composer-location" aria-label="项目与运行位置">
          <button type="button" class="badge ws-chip" id="wsChip" title="选择工作目录">📁 选择项目</button>
          <button type="button" class="ctrl-pill ctrl-menu" id="pillRemote" aria-haspopup="menu" title="运行位置：本机 / WSL / SSH 主机"><svg class="location-host-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M4 10h16M8 6.5h.01M8 14h.01M8 17.5h.01"/></svg><span class="dd-value" id="remoteLabel">本机</span><span class="dd-caret" aria-hidden="true"><svg class="composer-chevron" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m4.5 6.25 3.5 3.5 3.5-3.5"/></svg></span></button>
          <div class="composer-insights">
            <button type="button" id="ctxMeter" class="ctx-meter" aria-label="查看上下文容量" aria-expanded="false" aria-haspopup="dialog" aria-controls="ctxPanel" title="上下文容量与窗口设置"><svg class="ctx-symbol" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="5" width="15" height="15" rx="3"/><path d="M15 2H6a4 4 0 0 0-4 4v9M9 10h7M9 14h4"/></svg><span class="ctx-text">上下文窗口</span><svg class="ctx-chevron" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 6.5 3 3 3-3"/></svg><span class="ctx-track" aria-hidden="true"></span></button>
            <button type="button" id="composerUsage" title="一键查看当前会话的 Token、缓存与逐请求明细"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M4 20h16M7 16v-5m5 5V5m5 11V8"/></svg><span>会话统计</span><b class="composer-usage-count" hidden></b></button>
          </div>
        </div>
        <div id="sendFeedback" class="send-feedback" role="status" aria-live="polite" hidden><span class="send-feedback-icon" aria-hidden="true"></span><span class="send-feedback-text"></span><button type="button" id="sendFeedbackRetry" hidden>重试发送</button><button type="button" id="sendFeedbackDismiss" aria-label="关闭发送提示" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="m6 6 12 12M6 18 18 6"/></svg></button></div>
        <div class="composer-panel">
          <textarea id="inpText" rows="1" aria-label="消息内容" placeholder="描述任务，输入 @ 引用文件、@@ 引用会话，或 /btw 旁问…"></textarea>
          <div id="mentionMenu" class="mention-menu hidden" role="listbox" aria-label="引用其它会话"></div>
          <div id="attachStrip" class="attach-strip hidden"></div>
          <div class="composer-controls">
            <button type="button" class="composer-icon" id="btnAttach" title="添加图片附件" aria-label="添加图片附件">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 16-5.5-5.5L6 21"/></svg><span class="composer-tool-label">图片</span>
            </button>

            <span class="config-icon" data-ui-icon="shield" aria-hidden="true"></span><span class="ctrl-label">权限</span><span class="dd-value" id="permLabel">自动</span><span class="dd-caret" aria-hidden="true"><svg class="composer-chevron" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m4.5 6.25 3.5 3.5 3.5-3.5"/></svg></span>
          </button>

            <select id="selProvider" class="hidden"></select>
            <select id="selRemote" class="hidden"></select>

              <option value="minimal">minimal · 最低</option>
              <option value="low">low · 低</option>
              <option value="medium">medium · 中</option>
              <option value="high">high · 高</option>
              <option value="xhigh">xhigh · 超高</option>
              <option value="max">max · 最大</option>
              <option value="ultra">ultra · 极高</option>
            </select>
            <select id="selPerm" class="hidden">
              <option value="auto">自动权限 · 跳过全部确认</option>
              <option value="edits">接受编辑 · 编辑自动批准</option>
              <option value="plan">计划模式 · 只读调研</option>
              <option value="ask">询问 · 不跳过，需确认的操作会被拒</option>

            <button id="btnSend" title="发送" aria-label="发送消息">

    <div id="termPanel" class="hidden">

      <div class="term-head">
        <span class="term-label">终端</span>
        <div id="termTabs" class="term-tabs"></div>
        <div class="term-actions">
          <button class="btn-mini" id="btnTermNew" title="新建本机终端">＋ 终端</button>
          <button class="btn-mini hidden" id="btnTermWsl" title="新建 WSL 终端">＋ WSL</button>
          <button class="btn-mini" id="btnTermClear" title="清屏">清屏</button>
          <button class="btn-mini" id="btnTermHide" title="收起终端（终端继续运行）">—</button>
          <button class="btn-mini" id="btnTermClose" title="关闭当前标签">✕</button>
        </div>
      </div>
      <div id="termContainer"></div>
    </div>

    <!-- ================= 右侧代码审查面板 ================= -->
    <aside id="reviewPanel" class="hidden" aria-label="工作区">
      <div id="reviewResize" class="review-resize" role="separator" aria-orientation="vertical"
        aria-label="调整右侧预览宽度" aria-valuemin="460" aria-valuemax="1100" aria-valuenow="820"
        tabindex="0" title="拖动调整预览宽度"></div>
      <div class="review-head">
        <div class="review-head-main">
          <span id="reviewHeadIcon" class="review-head-icon">⌘</span>
          <div class="review-head-copy">
            <b>审查</b>
            <span id="reviewTitle">改动文件</span>
            <small id="reviewPath" class="review-head-path"></small>
          </div>
        </div>
        <div class="review-head-actions">
          <button type="button" class="btn-mini review-terminal-toggle" id="reviewTerminal" title="显示项目终端" aria-label="切换项目终端" aria-controls="termPanel" aria-pressed="false"><span data-ui-icon="terminal" aria-hidden="true"></span><span>终端</span></button>
          <button class="btn-mini hidden" id="reviewEdit" title="在内置编辑器中打开（可保存）">编辑</button>
          <button class="btn-mini hidden" id="reviewDownload" title="下载 / 另存为">下载</button>
          <button class="btn-mini hidden" id="reviewSystem" title="用系统默认应用打开">系统打开</button>
          <button class="btn-mini hidden" id="reviewMax" title="最大化 / 还原面板">⤢</button>
          <button class="btn-mini hidden" id="reviewReveal" title="在文件管理器中显示">定位</button>
          <button class="btn-mini" id="reviewClose" title="收起工作区">✕</button>
        </div>
      </div>

        <button type="button" id="reviewExplorerToggle" aria-controls="reviewExplorer" aria-expanded="true" title="显示或收起目录"><span data-ui-icon="folder" aria-hidden="true"></span><span>目录</span></button>
        <div class="review-layout-options" role="group" aria-label="文件布局">
          <button type="button" id="reviewLayoutExplorer" aria-pressed="true" title="左侧目录、右侧文件"><span data-ui-icon="sidebar" aria-hidden="true"></span><span>工作区</span></button>
          <button type="button" id="reviewLayoutTabs" aria-pressed="false" title="目录和文件分别在标签中打开"><span data-ui-icon="tabs" aria-hidden="true"></span><span>标签</span></button>

      </div>

        <section class="review-document" aria-label="文件内容">

<!-- ================= 确认/输入层 =================
     原生 confirm/prompt 会冻结整页 JS（直播中的会话也停更），
     统一换成自绘层；独立于 #dlg，可在任意弹窗之上二次确认。 -->
<div id="confirmWrap" class="hidden" aria-hidden="true">
  <div id="confirmBox" role="alertdialog" aria-modal="true" aria-labelledby="confirmTitle" aria-describedby="confirmMsg">
    <div class="cf-head" id="confirmTitle">确认</div>
    <div class="cf-msg" id="confirmMsg"></div>
    <div class="cf-input hidden"><input id="confirmInput" autocomplete="off" spellcheck="false"></div>
    <div class="cf-actions">
      <button type="button" class="btn ghost" id="confirmCancel">取消</button>
      <button type="button" class="btn" id="confirmOk">确定</button>
    </div>
  </div>
</div>

<!-- ================= 登录层（启用账户认证后出现） ================= -->
<div id="authLayer" class="hidden" role="dialog" aria-modal="true" aria-labelledby="authTitle">
  <form id="authBox" autocomplete="on">
    <div class="auth-logo">⬡</div>
    <div class="auth-title" id="authTitle">OrbitCell</div>
    <div class="auth-sub">输入用户名与密码访问本工作台</div>
    <label class="auth-fld"><span>用户名</span><input id="authUser" autocomplete="username" spellcheck="false"></label>
    <label class="auth-fld"><span>密码</span><input id="authPass" type="password" autocomplete="current-password"></label>
    <label class="auth-remember"><input id="authRemember" type="checkbox" checked> 记住我（180 天）</label>
    <div class="auth-error hidden" id="authError"></div>
    <button type="submit" class="btn" id="authLogin">登录</button>
  </form>
</div>

<!-- ================= /btw 旁问浮层 ================= -->
<section id="btwPanel" class="btw-panel hidden" role="dialog" aria-modal="false" aria-labelledby="btwTitle">
  <div class="btw-head">
    <div><span class="btw-glyph">?</span><b id="btwTitle">旁问</b><small>不写入当前会话</small></div>
    <button type="button" class="btn-mini" id="btwClose" aria-label="关闭旁问">✕</button>
  </div>
  <div class="btw-context" id="btwContext">使用当前会话最近的上下文</div>
  <textarea id="btwInput" rows="2" placeholder="想快速确认什么？"></textarea>
  <div class="btw-actions">
    <span id="btwStatus" aria-live="polite"></span>
    <button type="button" class="btn" id="btwAsk">询问</button>
  </div>
  <div id="btwAnswer" class="btw-answer hidden"></div>
</section>
